<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK Hop-On Hop-Off — Live Bus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#171735;
    --bg-panel:#20204a;
    --bg-panel-2:#262657;
    --line-gold:#FFC93C;
    --pink:#F0356B;
    --pink-glow: rgba(240,53,107,0.55);
    --teal:#2ED9C3;
    --teal-glow: rgba(46,217,195,0.55);
    --text-light:#F6F4FF;
    --text-muted:#A9A6CF;
    --text-dim:#726F9C;
    --stop-fill:#2B2B5C;
    --stop-stroke:#4A4A8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #2b2b66 0%, transparent 55%),
      radial-gradient(ellipse at 100% 10%, #1f3d4a 0%, transparent 45%),
      var(--bg-deep);
    color:var(--text-light);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 18px 60px;
  }
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding-bottom:18px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 6px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(28px,5vw,42px);
    margin:0;
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--pink);}
  .clockbox{
    text-align:right;
    min-width:180px;
  }
  .clock{
    font-family:'Space Mono',monospace;
    font-size:clamp(26px,4vw,34px);
    font-weight:700;
    color:var(--line-gold);
    line-height:1;
  }
  .clock-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:4px;
  }
  .status-pill{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:99px;
  }
  .status-pill.open{background:rgba(46,217,195,0.15);color:var(--teal);border:1px solid rgba(46,217,195,0.4);}
  .status-pill.closed{background:rgba(240,53,107,0.15);color:var(--pink);border:1px solid rgba(240,53,107,0.4);}
  .countdown{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    margin-top:6px;
  }
  .countdown b{color:var(--line-gold); font-weight:700;}

  .layout{
    display:grid;
    grid-template-columns: minmax(0,1fr);
    gap:18px;
  }
  .stage{
    background:var(--bg-panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:20px;
    padding:10px;
    position:relative;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 40%, rgba(255,201,60,0.05), transparent 60%);
    pointer-events:none;
  }
  svg{display:block;width:100%;height:auto;}

  .route-line{
    fill:none;
    stroke:var(--line-gold);
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.85;
  }
  .route-line-glow{
    fill:none;
    stroke:var(--line-gold);
    stroke-width:14;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.12;
    filter:blur(2px);
  }
  .stop-node{cursor:pointer;}
  .stop-circle{
    fill:var(--stop-fill);
    stroke:var(--stop-stroke);
    stroke-width:2.5;
    transition:fill .25s, stroke .25s, filter .25s;
  }
  .stop-circle.start{
    fill:#173b3a;
    stroke:var(--teal);
  }
  .stop-circle.active{
    fill:var(--pink);
    stroke:#ffd9e4;
    filter:drop-shadow(0 0 10px var(--pink-glow));
  }
  .stop-circle.active.start{
    fill:var(--teal);
    stroke:#d9fff8;
    filter:drop-shadow(0 0 10px var(--teal-glow));
  }
  .stop-num{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:17px;
    fill:var(--text-light);
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
    transition:font-size .2s, fill .2s;
  }
  .stop-num.active{
    font-size:21px;
    fill:#171735;
  }
  .stop-label{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    fill:var(--text-muted);
    text-anchor:middle;
    pointer-events:none;
  }
  .stop-label.active{fill:var(--text-light);}
  .leg-label{
    font-family:'Inter',sans-serif;
    font-size:11px;
    fill:#7d7ab0;
    text-anchor:middle;
    pointer-events:none;
  }

  .bus-badge circle{stroke-width:2; stroke:#171735;}
  .bus-badge.a circle{fill:var(--pink);}
  .bus-badge.b circle{fill:var(--teal);}
  .bus-badge text{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    fill:#171735;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }

  .bus-icon{
    filter:drop-shadow(0 0 8px rgba(0,0,0,0.5));
  }
  .bus-a .bus-body{fill:var(--pink);}
  .bus-b .bus-body{fill:var(--teal);}
  .bus-pulse{
    fill:none;
    stroke-width:2;
    opacity:0;
  }

  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:900px){ .cards{grid-template-columns:1fr;} }
  .live-ring{
    fill:none;
    stroke-width:3;
    opacity:0;
    pointer-events:none;
  }
